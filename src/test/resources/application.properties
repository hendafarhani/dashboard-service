# =============================================================================
# Test configuration. Checked against production by CI - do not edit casually.
# =============================================================================
#
# Tests cannot reach a config server, so this file carries a local copy of the
# keys the context needs to start. dashboard-service builds as its own
# repository, so ../centralized-config is not on the CI checkout and the real
# files cannot be imported here.
#
# The copy is NOT unchecked. centralized-config runs
# .github/scripts/check-config-drift.py over every service in the fleet, checked
# out side by side. It resolves the effective production config
# (centralized-configuration/application.properties merged underneath
# <service>.properties, placeholders expanded) and compares it to this file.
# Keys present in both and disagreeing are reported two ways:
#
#   contract keys   -> ::error::  and the build FAILS. Topic names, consumer
#                      group ids, listener ids, tuning: what this service and
#                      its tests must agree on for the tests to mean anything.
#   environment     -> ::notice:: and the build passes. Addresses, credentials,
#                      drivers, on/off switches - h2 instead of MySQL,
#                      localhost:9092 instead of kafka:9092. These are SUPPOSED
#                      to differ; that is what makes the suite runnable offline.
#
# So the contract values below must mirror centralized-config exactly. If one
# drifts, fix it at the source in centralized-config and mirror it here - do not
# "resolve" a reported drift by quietly editing this file to match something
# else, and do not rename these to test-only values: the job reads a rename as
# drift and fails the build.
# =============================================================================

# --- run detached from config server and service registry ---
spring.cloud.config.enabled=false
spring.config.import=optional:configserver:
spring.cloud.discovery.enabled=false
eureka.client.enabled=false

# --- environment overrides: expected to differ, reported as notices ---
kafka.bootstrap-servers=localhost:9092

spring.datasource.url=jdbc:h2:mem:dashboardservicedb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# --- contract keys: MUST match centralized-config exactly (drift fails CI) ---
# topics          <- centralized-configuration/application.properties
# group/listener  <- centralized-configuration/dashboard-service.properties
microgo.topics.ride-request-events=ride.request.events
microgo.topics.ride-request-events-acks=ride.request.events.acks
dashboard.service.consumer-group-id=dashboard-service.group
dashboard.service.listener-id=dashboardServiceListener
